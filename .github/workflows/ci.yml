name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # The unit and compatibility tests run on both platforms. The game project
  # has no Windows-only API outside its P/Invoke layer, so the net9.0 build and
  # the whole test suite work on Linux too. Compatibility tests skip themselves
  # when no IWAD is present instead of failing.
  tests:
    name: Tests / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Test
        run: dotnet test DPTDOOMTest/DPTDOOMTest.csproj -c Release --nologo --logger "console;verbosity=normal"

  # The shipped build is net40, and the launcher and the Win32 front end are
  # Windows-only, so the full solution is built on Windows.
  build:
    name: Build / Windows
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Build solution
        run: dotnet build DPTDOOM.slnx -c Release --nologo

      - name: Verify the shipped build is standalone
        shell: pwsh
        run: ./tools/check-standalone.ps1

      - name: Verify the shipped build still runs on Windows XP
        # Windows XP is a stated target and "it still works on XP" was an intention
        # rather than a check. The PE header decides whether XP will load the
        # executable at all, and a Vista-only Win32 call throws only on XP, long
        # after every test on a modern machine has gone green.
        shell: pwsh
        run: ./tools/check-xp.ps1

      - name: Icon is usable on Windows XP
        shell: pwsh
        run: ./tools/test-icon.ps1

      - name: Window and input regression
        shell: pwsh
        run: ./tools/test-window.ps1 -Exe ./DPTDOOM/bin/Release/net40/dptdoom.exe

      - name: Headless runs are reproducible
        # "-tics" used to count Update calls, and the level-start wipe consumed a
        # variable number of them, so the same command produced a different world
        # every run. This keeps that fixed, and checks that a WAD inside a PK3
        # gives the same world as the WAD itself.
        shell: pwsh
        run: ./tools/test-headless.ps1

      - name: Master directory protocol
        shell: pwsh
        run: |
          $master = Start-Process -FilePath ./DPTDOOM.Master/bin/Release/net40/dptdoom-master.exe `
            -ArgumentList '--port', '25145', '--relay', '--relay-port', '25146', '--log', 'master-ci.log' -PassThru
          try {
            Start-Sleep -Seconds 2
            ./tools/test-master.ps1 -Port 25145
          } finally {
            if (-not $master.HasExited) { $master.Kill() }
          }

      - name: Relay end to end
        # Skips itself when no IWAD is available, like the headless test. When an
        # IWAD is present it runs a real host and a real guest through the relay
        # and compares world hashes, which is the only check that proves the
        # tunnel is invisible to the simulation.
        shell: pwsh
        run: ./tools/test-relay.ps1

      - name: Full speed at high ping
        # Lockstep used to advance one tic per round trip, so a 100 ms ping
        # halved the tic rate and made the game run at half speed - which read
        # as a network problem and was not one: the session uses about 1.5 KB/s.
        # The input delay buffer fixed it, and this keeps it fixed.
        shell: pwsh
        run: ./tools/test-net-latency.ps1

      - name: Bots finish MAP01
        # Nothing asserted the outcome before, so a bot that explored and then
        # froze for the rest of the run passed every test. Runs the real game,
        # because an in-process bot without a brain and a temperament does not
        # behave the same way.
        shell: pwsh
        run: ./tools/test-bots.ps1

      - name: Bots over the network
        shell: pwsh
        run: ./tools/test-net-bots.ps1

      - name: Session survives a dropped link
        # Kills the proxy the guest is talking through and starts it again. Without
        # reconnection the session ends; with it, both ends freeze on the same tic,
        # replay the lost commands and must still agree on the world hash.
        shell: pwsh
        run: ./tools/test-reconnect.ps1

      - name: The render profiler changes nothing it measures
        # The profiler sits inside the column routines and takes valid counts from
        # the world, so it can plausibly shift a hash. This compares the frame and
        # the world hash against a run without -profile.
        shell: pwsh
        run: ./tools/test-profile.ps1

      - name: Crosshair and vertical look
        # Both are presentation, and the assertion that matters is that they stay
        # presentation: a tilt that reached the world would break demo playback
        # while looking perfectly fine on screen.
        shell: pwsh
        run: ./tools/test-view.ps1

      - name: Settings screen and console
        # Opens both overlays without a keyboard and checks that they draw, that
        # they stay where they belong, and that neither changes the world.
        shell: pwsh
        run: ./tools/test-console.ps1

      - name: Automap debug overlays actually draw
        # "-maponly" was in the command line and did nothing: it was applied only by
        # the window's own toggle, so a headless run ignored it and every screenshot
        # of a debug overlay was identical to the plain frame.
        shell: pwsh
        run: ./tools/test-debug-overlays.ps1

      - name: Window menu and tray
        shell: pwsh
        run: ./tools/test-menu.ps1

      - name: Launcher bridge
        # Windows PowerShell 5.1, not pwsh: the test loads the net40 WinForms
        # assembly, and PowerShell 7 runs on .NET and cannot host it.
        shell: powershell
        run: ./tools/test-launcher.ps1

      - name: Package build
        shell: pwsh
        run: ./tools/package-build.ps1 -Version "0.1.0-${{ github.sha }}"

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: dptdoom-windows-${{ github.sha }}
          path: artifacts/*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs-${{ github.sha }}
          path: |
            master-ci.log
            DPTDOOM.Launcher/bin/Release/net40/launcher-debug.txt
          if-no-files-found: ignore
          retention-days: 7
